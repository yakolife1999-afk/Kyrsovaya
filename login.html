<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Цифровой коуч для саморазвития</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Дополнительные стили для страницы входа */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .login-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            flex: 1 0 auto;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #2980b9, #3498db);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #3498db;
            text-decoration: none;
            margin-top: 25px;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #2980b9;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3498db;
        }
        
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }
        
        .rotating-background {
            height: 80vh;
            min-height: 500px;
            position: relative;
            margin-top: 30px;
            flex: 0 0 auto;
            overflow: hidden;
            background-color: #2c3e50;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            z-index: 1;
            filter: brightness(1.05) contrast(1.05) saturate(1.1);
            transition: opacity 0.5s ease-in-out;
            will-change: opacity;
        }
        
        .slide.active {
            opacity: 1;
            z-index: 2;
        }
        
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.3);
            z-index: 3;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .login-container {
                margin: 30px 20px;
                padding: 30px 20px;
            }
            
            .login-header h1 {
                font-size: 2rem;
            }
            
            .rotating-background {
                height: 50vh;
                min-height: 350px;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка сайта -->
    <header class="header">
        <nav class="nav">
            <div class="nav-left">
                <a href="index.html"><i class="fas fa-home"></i> Главная</a>
                <a href="locations.html"><i class="fas fa-map-marked-alt"></i> Карта</a>
            </div>
            <div class="nav-right" id="navRight">
                <!-- Навигация будет обновлена через script.js -->
            </div>
        </nav>
    </header>

    <!-- Форма входа -->
    <main class="main-content">
        <div class="login-container">
            <div class="login-header">
                <h1>Вход в систему</h1>
                <p>Войдите в свой аккаунт для доступа к персонализированному коучингу</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email адрес</label>
                    <input type="email" id="email" class="form-control" placeholder="Введите ваш email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" class="form-control" placeholder="Введите ваш пароль" required>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Запомнить меня</label>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Войти в систему
                </button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <p>Нет аккаунта? <a href="register.html" style="color: #3498db; text-decoration: none;">Зарегистрироваться</a></p>
                </div>
                
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Вернуться на главную
                </a>
            </form>
        </div>
    </main>

    <!-- Автоматически меняющиеся изображения -->
    <div class="rotating-background">
        <div class="image-overlay"></div>
        
        <!-- 3 слайда для изображений Горит -->
        <div id="slide1" class="slide"></div>
        <div id="slide2" class="slide"></div>
        <div id="slide3" class="slide"></div>
    </div>

    <!-- Подвал сайта -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <span>© 2026 Цифровой коуч для саморазвития. Помогаем расти и развиваться.</span>
            </div>
            <div class="footer-right">
                <a href="#"><i class="fas fa-question-circle"></i> Помощь</a>
                <a href="#"><i class="fas fa-shield-alt"></i> Безопасность</a>
                <a href="#"><i class="fas fa-user-friends"></i> Сообщество</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Дополнительная инициализация для страницы входа
            const imagePaths = [
                'C:/Users/yakol/OneDrive/Desktop/Курсовая/Горит.png',
                'C:/Users/yakol/OneDrive/Desktop/Курсовая/Горит2.png',
                'C:/Users/yakol/OneDrive/Desktop/Курсовая/Горит3.png'
            ];
            
            const fallbackImages = [
                'https://images.unsplash.com/photo-1553877522-43269d4ea984?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80',
                'https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80',
                'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'
            ];
            
            const slides = [
                document.getElementById('slide1'),
                document.getElementById('slide2'),
                document.getElementById('slide3')
            ];
            
            let currentIndex = 0;
            let direction = 1;
            let isTransitioning = false;
            
            function checkImageAvailability(url, callback) {
                const img = new Image();
                img.onload = () => callback(true, url);
                img.onerror = () => callback(false, url);
                img.src = url;
            }
            
            function preloadImages() {
                const promises = imagePaths.map((path, index) => {
                    return new Promise((resolve) => {
                        checkImageAvailability(path, (isAvailable, url) => {
                            if (isAvailable) {
                                slides[index].style.backgroundImage = `url('${url}')`;
                            } else {
                                const fallbackUrl = fallbackImages[index % fallbackImages.length];
                                slides[index].style.backgroundImage = `url('${fallbackUrl}')`;
                            }
                            resolve();
                        });
                    });
                });
                
                Promise.all(promises).then(() => {
                    setTimeout(() => {
                        changeSlide(0);
                    }, 100);
                });
            }
            
            function changeSlide(index) {
                if (isTransitioning) return;
                
                isTransitioning = true;
                
                slides.forEach(slide => {
                    slide.classList.remove('active');
                });
                
                slides[index].classList.add('active');
                currentIndex = index;
                
                setTimeout(() => {
                    isTransitioning = false;
                }, 500);
            }
            
            function startAutoSlide() {
                setInterval(() => {
                    if (isTransitioning) return;
                    
                    if (currentIndex === 2) {
                        direction = -1;
                    } else if (currentIndex === 0) {
                        direction = 1;
                    }
                    
                    const nextIndex = currentIndex + direction;
                    changeSlide(nextIndex);
                }, 500);
            }
            
            preloadImages();
            
            setTimeout(() => {
                startAutoSlide();
            }, 500);
            
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (!email || !password) {
                    alert('Пожалуйста, заполните все поля');
                    return;
                }
                
                if (!email.includes('@') || !email.includes('.')) {
                    alert('Введите корректный email адрес');
                    return;
                }
                
                // Устанавливаем статус авторизации
                localStorage.setItem('isLoggedIn', 'true');
                
                alert('Вход выполнен успешно!\n\nДобро пожаловать в систему цифрового коучинга!');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            });
        });
    </script>
</body>
</html>
